[project]
name = "felt-vision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benylin", email = "lealmariop@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[project.scripts]
felt-vision = "felt_vision.main:run"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# B008 (function-call-in-default-argument): FastAPI's own
# File()/UploadFile dependency-injection idiom - the "fix" ruff suggests
# would break the framework contract, a documented false positive for
# FastAPI (same as felt-core's api.py).
# E501 (line-too-long): one pre-existing long line in the system prompt.
"src/felt_vision/main.py" = ["B008", "E501"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
